<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1f3d2b" />
  <title>Vineyard</title>
  <style>
    :root { font-family: system-ui, -apple-system, sans-serif; color: #1c1917; background: #f5f0e8; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input, select, textarea { font: inherit; font-size: 16px; }
    .head { background: #1f3d2b; color: #e8efe9; padding: calc(env(safe-area-inset-top, 0px) + .7rem) 1rem .85rem; }
    .head h1 { margin: 0; font-size: 1.25rem; letter-spacing: .04em; text-transform: uppercase; }
    .sub { margin: .2rem 0 0; color: #b7c9bc; font-size: .85rem; }
    .back { background: none; border: 0; color: #c5d5c8; padding: 0 0 .4rem; }
    .wrap { padding: 1rem 1rem calc(1.5rem + env(safe-area-inset-bottom, 0px)); display: grid; gap: .85rem; }
    .home-actions { display: flex; gap: .5rem; }
    .home-actions a, .linkish { color: #7a1f2b; }
    .export-hero { width: 100%; font-size: 1.05rem; padding: .85rem 1rem; }
    .head-row { display: flex; justify-content: space-between; align-items: center; }
    .export-card .form { margin-top: .65rem; }
    .preview { white-space: pre-wrap; background: #faf6ef; border-radius: 8px; padding: .75rem; font-size: .85rem; max-height: 14rem; overflow: auto; margin: .65rem 0 0; }
    .block-link, .task-link {
      display: flex; justify-content: space-between; align-items: center; gap: .75rem;
      background: #fff; border: 1px solid #e7ddd0; border-radius: 12px; padding: .95rem 1rem; text-align: left; width: 100%;
    }
    .block-link strong, .task-link strong { display: block; }
    .meta { color: #78716c; font-size: .85rem; margin: .15rem 0 0; }
    .chev { color: #a8a29e; }
    .row-actions { display: flex; gap: .25rem; }
    .panel { background: #fff; border: 1px solid #e7ddd0; border-radius: 12px; padding: 1rem; }
    .panel h2 { margin: 0 0 .6rem; font-size: 1rem; }
    .form { display: grid; gap: .5rem; margin-top: .5rem; }
    .form.grid { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
    .form input, .form select, .form button, .btn { border: 1px solid #d6cdc2; border-radius: 8px; padding: .55rem .7rem; }
    .btn, .form button, .primary {
      background: #7a1f2b; color: #fff; border: 2px solid #7a1f2b; font-weight: 700;
    }
    .ghost, .ghost.btn {
      background: #d9ecfb; color: #163a5f; border: 2px solid #4d9de0; font-weight: 700;
    }
    .danger, button.danger {
      background: #f4c2c2; color: #7a2e2e; border: 2px solid #e8a0a0; border-radius: 8px;
      padding: .45rem .65rem; font-weight: 700;
    }
    .tabs { display: flex; flex-wrap: wrap; gap: .4rem; }
    .tabs button { flex: 1 1 30%; border: 1px solid #d6cdc2; background: #fff; border-radius: 999px; padding: .5rem; }
    .tabs button.on { background: #1f3d2b; color: #fff; border-color: #1f3d2b; }
    .rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: .45rem; }
    .row-btn { min-height: 52px; border: 2px solid #2f7ec4; background: #4d9de0; color: #fff; border-radius: 10px; font-weight: 700; font-size: .78rem; padding: .25rem; }
    .row-btn.done { background: #f4c2c2; border-color: #e8a0a0; color: #7a2e2e; }
    .bar { height: 8px; background: #efe7dc; border-radius: 99px; overflow: hidden; margin: .75rem 0 1rem; }
    .bar span { display: block; height: 100%; background: #2d5640; }
    .muted, .empty { color: #57534e; }
    .empty { margin: 0; }
    .note { background: #f8f1e3; border-radius: 10px; padding: .75rem .9rem; font-size: .92rem; color: #44403c; }
    .list { list-style: none; margin: 0; padding: 0; }
    .list li { display: grid; grid-template-columns: 1fr auto; gap: .5rem; padding: .65rem 0; border-top: 1px solid #efe7dc; }
    .stat { font-size: 1.4rem; font-weight: 700; }
    .rename { width: 100%; border: 0; background: transparent; color: inherit; font-size: 1.25rem; font-weight: 700; padding: 0; letter-spacing: .04em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const DEFAULT_TASKS = [
      ["long-pruning", "Long pruning"],
      ["short-pruning", "Short pruning"],
      ["shoot-thinning", "Shoot thinning"],
      ["lateral-pulling", "Lateral pulling"],
      ["leaf-pulling", "Leaf pulling"],
      ["fruit-drop", "Fruit drop"],
      ["rot-removal", "Rot removal"],
      ["bird-nets-up", "Bird nets up"],
      ["bird-nets-removed", "Bird nets removed"],
      ["harvest", "Harvest"],
    ];
    const SERVICE = ["Greasing","Oil change","Oil filter","Air filter","Fuel filter","Coolant","Hydraulic fluid","Tire check","Belt / chain","Inspection"];
    const BLOCKS = [
      ["DA Tannat", "Tannat"],
      ["DA Cabernet", "Cabernet"],
      ["DA Tempranillo", "Tempranillo"],
      ["DA Malvasia", "Malvasia"],
      ["DA Grecco De Tuffo", "Grecco De Tuffo"],
      ["DA Syrah", "Syrah"],
      ["DA Vermentino", "Vermentino"],
      ["DA Counois", "Counois"],
      ["DA Seyval Blanc", "Seyval Blanc"],
      ["HM Petit Sirah", "Petit Sirah"],
      ["HM Toraldego", "Toraldego"],
      ["HM Syrah 525", "Syrah 525"],
      ["HM Syrah 471", "Syrah 471"],
      ["HM Grenach", "Grenach"],
    ];
    const KEY = "vineyard-html-v3";
    const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
    const today = () => new Date().toISOString().slice(0, 10);
    const rowKey = (y, b, t, r) => y + ":" + b + ":" + t + ":" + r;

    function mergeTasks(list) {
      const skip = ["foliar-spray", "weed-whacking", "herbicide-spray"];
      const next = (list && list.length ? list : DEFAULT_TASKS.map(([id, label]) => ({ id, label })))
        .filter((t) => !skip.includes(t.id));
      for (const [id, label] of DEFAULT_TASKS) {
        if (!next.some((t) => t.id === id || t.label === label)) next.push({ id, label });
      }
      return next;
    }

    function empty() {
      return {
        year: new Date().getFullYear(),
        blocks: BLOCKS.map(([name, variety]) => ({ id: uid(), name, variety, rows: 40, plants: "" })),
        tasks: DEFAULT_TASKS.map(([id, label]) => ({ id, label })),
        done: {},
        sprays: [],
        chemicals: [],
        samples: [],
        watering: [],
        herbicide: [],
        weedLogs: [],
        equipment: [],
        serviceTypes: SERVICE.slice(),
        serviceLogs: [],
        history: [],
      };
    }

    function rollover(data) {
      const now = new Date().getFullYear();
      if (!data.history) data.history = [];
      if (data.year >= now) return data;
      data.history.push({
        year: data.year,
        savedAt: new Date().toISOString(),
        done: data.done,
        sprays: data.sprays,
        herbicide: data.herbicide,
        watering: data.watering,
        weedLogs: data.weedLogs,
        samples: data.samples,
      });
      data.year = now;
      data.done = {};
      data.sprays = [];
      data.herbicide = [];
      data.watering = [];
      data.weedLogs = [];
      data.samples = [];
      return data;
    }

    function load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (!raw) return empty();
        const data = Object.assign(empty(), JSON.parse(raw));
        data.tasks = mergeTasks(data.tasks);
        if (!data.watering) data.watering = [];
        if (!data.herbicide) data.herbicide = [];
        if (!data.weedLogs) data.weedLogs = [];
        if (!data.history) data.history = [];
        data.blocks = data.blocks.map((b) => Object.assign({ plants: "", variety: "", rows: 40 }, b));
        return rollover(data);
      } catch { return empty(); }
    }

    let data = load();
    let screen = "home";
    let blockId = "";
    let taskId = "";
    let sprayId = "";
    let herbId = "";
    let tab = "tasks";
    let copied = "";

    const save = () => localStorage.setItem(KEY, JSON.stringify(data));
    save();
    const block = () => data.blocks.find((b) => b.id === blockId);
    const task = () => data.tasks.find((t) => t.id === taskId);
    const esc = (s) => String(s ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll('"',"&quot;");

    function countDone(b, t) {
      let n = 0;
      for (let r = 1; r <= b.rows; r++) if (data.done[rowKey(data.year, b.id, t, r)]) n++;
      return n;
    }
    function sprays(id, kind) {
      const list = kind === "herbicide" ? data.herbicide : data.sprays;
      return list.filter((s) => s.year === data.year && s.blockId === id)
        .sort((a, b) => b.date.localeCompare(a.date));
    }
    function sprayCount(s, rows) {
      let n = 0; for (let r = 1; r <= rows; r++) if (s.rows[String(r)]) n++; return n;
    }
    function waterHours(id) {
      return data.watering
        .filter((w) => w.year === data.year && w.blockId === id)
        .reduce((sum, w) => sum + (parseFloat(w.hours) || 0), 0);
    }
    function weedHours(id) {
      return (data.weedLogs || [])
        .filter((w) => w.year === data.year && w.blockId === id)
        .reduce((sum, w) => sum + (parseFloat(w.hours) || 0), 0);
    }
    function latestSample(id) {
      return data.samples
        .filter((s) => s.blockId === id)
        .sort((a, b) => b.date.localeCompare(a.date))[0];
    }
    function sprayedList(s) {
      return Object.keys(s.rows || {}).map(Number).sort((a, b) => a - b).join(";");
    }
    function activeSpray(kind) {
      const list = sprays(blockId, kind);
      const selected = kind === "herbicide" ? herbId : sprayId;
      return list.find((s) => s.id === selected) || list[0];
    }

    function csvEscape(v) {
      const t = String(v ?? "");
      return /[",\n]/.test(t) ? '"' + t.replaceAll('"', '""') + '"' : t;
    }
    function csv(rows) { return "\uFEFF" + rows.map((r) => r.map(csvEscape).join(",")).join("\n") + "\n"; }

    function reports() {
      const y = data.year;
      const bn = (id) => data.blocks.find((b) => b.id === id)?.name || "Unknown";

      const ovHeader = ["Year", "Block", "Variety", "Rows", ...data.tasks.map((t) => t.label + " done"), "Water hours", "Weed hours", "Latest sample", "Brix", "pH", "TA"];
      const ovRows = [ovHeader];
      const ovLines = ["Vineyard overview · " + y, ""];
      for (const b of data.blocks) {
        const sample = latestSample(b.id);
        ovRows.push([
          y, b.name, b.variety, b.rows,
          ...data.tasks.map((t) => countDone(b, t.id) + "/" + b.rows),
          waterHours(b.id), weedHours(b.id),
          sample?.date || "", sample?.brix || "", sample?.ph || "", sample?.ta || "",
        ]);
        ovLines.push(b.name + (b.variety ? " (" + b.variety + ")" : ""));
        ovLines.push("  Tasks: " + data.tasks.map((t) => t.label + " " + countDone(b, t.id) + "/" + b.rows).join("; "));
        ovLines.push("  Water: " + (waterHours(b.id) || 0) + " hrs · Weeds: " + (weedHours(b.id) || 0) + " hrs");
        ovLines.push(sample
          ? "  Latest harvest: " + sample.date + " · Brix " + (sample.brix || "—") + " · pH " + (sample.ph || "—") + " · TA " + (sample.ta || "—")
          : "  Latest harvest: none");
        ovLines.push("");
      }

      const allSprays = [
        ...(data.sprays || []).filter((s) => s.year === y).map((s) => Object.assign({}, s, { kind: "Foliar" })),
        ...(data.herbicide || []).filter((s) => s.year === y).map((s) => Object.assign({}, s, { kind: "Herbicide" })),
      ].sort((a, b) => b.date.localeCompare(a.date) || a.kind.localeCompare(b.kind));
      const spRows = [["Year", "Kind", "Date", "Block", "Chemical", "Rate", "Volume", "Tank", "Notes", "Rows done", "Total rows", "Rows"]];
      const spLines = ["Sprays log · " + y, ""];
      for (const s of allSprays) {
        const bl = data.blocks.find((x) => x.id === s.blockId);
        const total = bl?.rows || 0;
        spRows.push([y, s.kind, s.date, bn(s.blockId), s.chemical, s.rate, s.volume, s.tank, s.notes, sprayCount(s, total), total, sprayedList(s)]);
        spLines.push(s.date + " · " + s.kind + " · " + bn(s.blockId));
        spLines.push("  " + s.chemical + (s.rate ? " · Rate " + s.rate : "") + (s.volume ? " · Vol " + s.volume : "") + (s.tank ? " · Tank " + s.tank : ""));
        spLines.push("  Rows " + sprayCount(s, total) + "/" + total + (s.notes ? " · " + s.notes : ""));
        spLines.push("");
      }
      if (!allSprays.length) spLines.push("No foliar or herbicide passes this season.");

      const blkRows = [["Year", "Block", "Section", "Date", "Detail", "Value", "Notes"]];
      const blkLines = ["Block-by-block · " + y, ""];
      for (const b of data.blocks) {
        blkLines.push("=== " + b.name + " ===");
        blkLines.push("Rows: " + b.rows + (b.variety ? " · " + b.variety : ""));
        for (const t of data.tasks) {
          const n = countDone(b, t.id);
          blkRows.push([y, b.name, "Task", "", t.label, n + "/" + b.rows, ""]);
          blkLines.push("  " + t.label + ": " + n + "/" + b.rows);
        }
        blkLines.push("  Watering: " + (waterHours(b.id) || 0) + " hrs");
        for (const w of data.watering.filter((x) => x.year === y && x.blockId === b.id)) {
          blkRows.push([y, b.name, "Watering", w.date, "Hours", w.hours, w.notes]);
          blkLines.push("    " + w.date + " · " + w.hours + " hrs" + (w.notes ? " · " + w.notes : ""));
        }
        blkLines.push("  Weeds: " + (weedHours(b.id) || 0) + " hrs");
        for (const w of (data.weedLogs || []).filter((x) => x.year === y && x.blockId === b.id)) {
          blkRows.push([y, b.name, "Weeds", w.date, "Hours", w.hours, w.notes]);
          blkLines.push("    " + w.date + " · " + w.hours + " hrs" + (w.notes ? " · " + w.notes : ""));
        }
        const foliar = sprays(b.id, "foliar");
        blkLines.push("  Foliar: " + foliar.length + " pass(es)");
        for (const s of foliar) {
          blkRows.push([y, b.name, "Foliar", s.date, s.chemical, sprayCount(s, b.rows) + "/" + b.rows, [s.rate, s.volume, s.notes].filter(Boolean).join(" · ")]);
          blkLines.push("    " + s.date + " · " + s.chemical + " · " + sprayCount(s, b.rows) + "/" + b.rows);
        }
        const herb = sprays(b.id, "herbicide");
        blkLines.push("  Herbicide: " + herb.length + " pass(es)");
        for (const s of herb) {
          blkRows.push([y, b.name, "Herbicide", s.date, s.chemical, sprayCount(s, b.rows) + "/" + b.rows, [s.rate, s.volume, s.notes].filter(Boolean).join(" · ")]);
          blkLines.push("    " + s.date + " · " + s.chemical + " · " + sprayCount(s, b.rows) + "/" + b.rows);
        }
        const samples = data.samples.filter((s) => s.blockId === b.id);
        blkLines.push("  Harvest samples: " + samples.length);
        for (const s of samples) {
          blkRows.push([y, b.name, "Harvest", s.date, s.rows, "Brix " + (s.brix || "—") + " / pH " + (s.ph || "—") + " / TA " + (s.ta || "—"), s.notes]);
          blkLines.push("    " + s.date + " · Brix " + (s.brix || "—") + " · pH " + (s.ph || "—") + " · TA " + (s.ta || "—"));
        }
        blkLines.push("");
      }

      return {
        overview: { title: "Vineyard overview", name: "vineyard-" + y + "-overview.csv", csv: csv(ovRows), text: ovLines.join("\n") },
        sprays: { title: "Sprays log", name: "vineyard-" + y + "-sprays.csv", csv: csv(spRows), text: spLines.join("\n") },
        blocks: { title: "Block-by-block", name: "vineyard-" + y + "-blocks.csv", csv: csv(blkRows), text: blkLines.join("\n") },
      };
    }

    async function shareCsv(name, text) {
      const blob = new Blob([text], { type: "text/csv;charset=utf-8" });
      const file = new File([blob], name, { type: blob.type });
      try {
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: name });
          return;
        }
      } catch (_) { /* fall through */ }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
    }

    async function shareText(title, text) {
      if (navigator.share) {
        try {
          await navigator.share({ title, text });
          return;
        } catch (_) { /* user cancel or fallback */ }
      }
      await navigator.clipboard.writeText(text);
      copied = title + " copied.";
    }

    function render() {
      const app = document.getElementById("app");
      if (screen === "home") app.innerHTML = homeHTML();
      else if (screen === "block") app.innerHTML = blockHTML();
      else if (screen === "task") app.innerHTML = taskHTML();
      else if (screen === "maintenance") app.innerHTML = maintHTML();
      else app.innerHTML = exportHTML();
      bind();
    }

    function homeHTML() {
      return `<header class="head"><h1>Vineyard</h1><p class="sub">${data.year} season · tap a block</p></header>
        <div class="wrap">
          ${data.history && data.history.length ? `<p class="note">${data.history.map((h)=>h.year).join(", ")} season${data.history.length>1?"s":""} saved. ${data.year} started fresh on Jan 1.</p>` : `<p class="note">${data.year} season. Completed rows, sprays, water, and weeds archive on Jan 1 and this list starts over. Blocks and equipment stay.</p>`}
          <button class="primary btn export-hero" data-go="export">Export data</button>
          <p class="muted">Share a season overview, sprays log, or block-by-block report.</p>
          ${data.blocks.map((b) => `<div style="display:grid;grid-template-columns:1fr auto;gap:.35rem;align-items:stretch">
            <button class="block-link" data-go="block" data-id="${b.id}">
              <span><strong>${esc(b.name)}</strong><p class="meta">${b.rows} rows${b.variety ? " · " + esc(b.variety) : ""} · ${waterHours(b.id) || 0} hrs water</p></span>
              <span class="chev">›</span>
            </button>
            <button class="danger" data-act="del-block" data-id="${b.id}">Delete</button>
          </div>`).join("") || `<p class="empty">No blocks yet.</p>`}
          <section class="panel">
            <h2>Add a block</h2>
            <form class="form grid" id="add-block">
              <input name="name" placeholder="Block name" required />
              <input name="rows" type="number" min="1" placeholder="Rows" value="40" />
              <button type="submit">Add</button>
            </form>
          </section>
          <button class="danger" data-act="clear-all-rows">Clear all completed rows this season</button>
          <p class="home-actions">
            <button class="primary btn" data-go="export">Export</button>
            <button class="ghost btn" data-go="maintenance">Maintenance</button>
          </p>
        </div>`;
    }

    function blockHTML() {
      const b = block();
      if (!b) { screen = "home"; return homeHTML(); }
      const hours = waterHours(b.id);
      const plants = parseFloat(b.plants);
      const gal = plants && hours ? (hours * plants * 1).toFixed(0) : null;
      return `<header class="head">
          <div class="head-row">
            <button class="back" data-go="home">‹ Blocks</button>
            <button class="back" data-go="export">Export</button>
          </div>
          <input class="rename" id="rename" value="${esc(b.name)}" />
          <label class="sub" style="display:flex;align-items:center;gap:.4rem;margin-top:.45rem">
            Rows
            <input id="row-count" type="number" min="1" value="${b.rows}" style="width:4.5rem;border:1px solid #4a6b56;background:#163325;color:#fff;border-radius:8px;padding:.25rem .4rem" />
            <span>· default 40 · ${data.year}</span>
          </label>
        </header>
        <div class="wrap">
          <div class="tabs">
            <button class="${tab==="tasks"?"on":""}" data-act="tab" data-id="tasks">Tasks</button>
            <button class="${tab==="water"?"on":""}" data-act="tab" data-id="water">Watering</button>
            <button class="${tab==="foliar"?"on":""}" data-act="tab" data-id="foliar">Foliar</button>
            <button class="${tab==="herbicide"?"on":""}" data-act="tab" data-id="herbicide">Herbicide</button>
            <button class="${tab==="weeds"?"on":""}" data-act="tab" data-id="weeds">Weeds</button>
          </div>
          ${tab === "foliar" ? foliarTabHTML(b, "foliar") : tab === "herbicide" ? foliarTabHTML(b, "herbicide") : tab === "weeds" ? weedTabHTML(b) : tab === "tasks" ? `
            ${data.tasks.map((t) => {
              const n = countDone(b, t.id);
              return `<button class="task-link" data-go="task" data-id="${t.id}">
                <span><strong>${esc(t.label)}</strong><p class="meta">${n} of ${b.rows} rows</p></span>
                <span class="chev">›</span>
              </button>`;
            }).join("")}
            <section class="panel">
              <h2>Add a task</h2>
              <form class="form grid" id="add-task">
                <input name="label" placeholder="New task name" required />
                <button type="submit">Add</button>
              </form>
            </section>
            <section class="panel">
              <h2>This block</h2>
              <form class="form grid" id="block-meta">
                <input name="variety" placeholder="Variety" value="${esc(b.variety)}" />
                <input name="rows" type="number" min="1" value="${b.rows}" />
                <input name="plants" type="number" min="0" placeholder="Plants (optional)" value="${esc(b.plants)}" />
                <button type="submit">Save</button>
              </form>
            </section>
          ` : `
            <section class="panel">
              <p class="stat">${hours || 0} hours</p>
              <p class="meta">this season on ${esc(b.name)}</p>
              ${gal ? `<p class="meta">About ${gal} gal if ${plants} plants × 1 gal/plant/hour</p>` : ""}
            </section>
            <p class="note">We talk about watering in <strong>hours</strong>. Each plant has 2 half-gallon emitters, so about <strong>1 gallon per plant per hour</strong>. Plant counts can be added later; hours are enough for now.</p>
            <section class="panel">
              <h2>Log water</h2>
              <form class="form grid" id="add-water">
                <input name="date" type="date" value="${today()}" required />
                <input name="hours" inputmode="decimal" placeholder="Hours" required />
                <input name="notes" placeholder="Notes" />
                <button type="submit">Save hours</button>
              </form>
              ${!data.watering.filter((w)=>w.year===data.year&&w.blockId===b.id).length ? `<p class="empty">No watering logged.</p>` : `<ul class="list">${data.watering.filter((w)=>w.year===data.year&&w.blockId===b.id).map((w)=>`<li><div><strong>${w.date} · ${w.hours} hrs</strong>${w.notes?`<p class="meta">${esc(w.notes)}</p>`:""}</div><button class="danger" data-act="del-water" data-id="${w.id}">Remove</button></li>`).join("")}</ul>`}
            </section>
          `}
        </div>`;
    }

    function foliarTabHTML(b, kind) {
      const spray = activeSpray(kind);
      const list = sprays(b.id, kind);
      const done = spray ? sprayCount(spray, b.rows) : 0;
      const label = kind === "herbicide" ? "Herbicide" : "Foliar";
      const sel = kind === "herbicide" ? "sel-herb" : "sel-spray";
      const del = kind === "herbicide" ? "del-herb" : "del-spray";
      const formId = kind === "herbicide" ? "herb-form" : "spray-form";
      return `
        <p class="note">${label} is logged each pass through the season. Start a new pass when the mix or date changes — it is not a one-time complete.</p>
        <section class="panel">
          <h2>${label} mix</h2>
          <p class="muted">Chemical, rate, and volume for this pass, then tap rows if you want.</p>
          <form class="form grid" id="${formId}">
            <input name="date" type="date" value="${today()}" required />
            <input name="chemical" placeholder="Chemical" required />
            <input name="rate" placeholder="Rate" />
            <input name="volume" placeholder="Volume (gal/ac)" />
            <input name="tank" placeholder="Tank gal" />
            <input name="notes" placeholder="Notes" />
            <button>Log pass</button>
          </form>
          ${list.length ? `<ul class="list">${list.map((s)=>`<li><button class="ghost" style="text-align:left;border:0;background:none;padding:0" data-act="${sel}" data-id="${s.id}"><strong>${s.date} · ${esc(s.chemical)}</strong><p class="meta">${[s.rate,s.volume,sprayCount(s,b.rows)+"/"+b.rows].filter(Boolean).join(" · ")}</p></button><button class="danger" data-act="${del}" data-id="${s.id}">Remove</button></li>`).join("")}</ul>` : `<p class="empty">No ${label.toLowerCase()} passes yet this season.</p>`}
        </section>
        <section class="panel">
          <div style="display:flex;justify-content:space-between;gap:.5rem;align-items:start">
            <p class="muted">${spray ? esc(spray.chemical) + " · " + done + " of " + b.rows + " rows" : "Log a pass, then tap rows if needed."}</p>
            <div class="home-actions">
              <button class="ghost btn" data-act="mark" ${spray?"":"disabled"}>Mark remaining rows done</button>
              <button class="danger" data-act="clear-rows" ${spray?"":"disabled"}>Clear completed rows</button>
            </div>
          </div>
          ${spray ? `<div class="bar"><span style="width:${b.rows?(done/b.rows)*100:0}%"></span></div>
            <div class="rows">${Array.from({length:b.rows},(_,i)=>`<button class="row-btn ${spray.rows[String(i+1)]?"done":""}" data-act="row" data-row="${i+1}">${spray.rows[String(i+1)] ? (i+1) + " done" : "Row " + (i+1)}</button>`).join("")}</div>` : ""}
        </section>`;
    }

    function weedTabHTML(b) {
      const logs = data.weedLogs.filter((w) => w.year === data.year && w.blockId === b.id);
      const hours = logs.reduce((sum, w) => sum + (parseFloat(w.hours) || 0), 0);
      return `
        <p class="note">Weed whacking happens throughout the season. Log each time you do it — do not mark it complete once.</p>
        <section class="panel">
          <p class="stat">${hours || 0} hours</p>
          <p class="meta">weed whacking this season on ${esc(b.name)}</p>
        </section>
        <section class="panel">
          <h2>Log weed whacking</h2>
          <form class="form grid" id="add-weed">
            <input name="date" type="date" value="${today()}" required />
            <input name="hours" inputmode="decimal" placeholder="Hours" required />
            <input name="notes" placeholder="Notes" />
            <button>Save log</button>
          </form>
          ${!logs.length ? `<p class="empty">No weed whacking logged.</p>` : `<ul class="list">${logs.map((w)=>`<li><div><strong>${w.date} · ${w.hours} hrs</strong>${w.notes?`<p class="meta">${esc(w.notes)}</p>`:""}</div><button class="danger" data-act="del-weed" data-id="${w.id}">Remove</button></li>`).join("")}</ul>`}
        </section>`;
    }

    function taskHTML() {
      const b = block();
      const t = task();
      if (!b || !t) { screen = "block"; return blockHTML(); }
      const harvest = t.id === "harvest";
      const done = countDone(b, t.id);
      let extra = "";
      if (harvest) {
        const samples = data.samples.filter((s) => s.blockId === b.id);
        extra += `<section class="panel">
          <h2>Fruit samples</h2>
          <form class="form grid" id="sample-form">
            <input name="date" type="date" value="${today()}" required />
            <input name="rows" placeholder="Rows sampled" />
            <input name="brix" placeholder="Brix" />
            <input name="ph" placeholder="pH" />
            <input name="ta" placeholder="TA" />
            <input name="notes" placeholder="Notes" />
            <button>Save sample</button>
          </form>
          ${samples.length ? `<ul class="list">${samples.map((s)=>`<li><div><strong>${s.date}</strong><p class="meta">Brix ${s.brix||"—"} · pH ${s.ph||"—"} · TA ${s.ta||"—"}</p></div><button class="danger" data-act="del-sample" data-id="${s.id}">Remove</button></li>`).join("")}</ul>` : `<p class="empty">No samples yet.</p>`}
        </section>`;
      }
      const rowDone = (r) => Boolean(data.done[rowKey(data.year, b.id, t.id, r)]);
      return `<header class="head">
          <button class="back" data-go="block" data-id="${b.id}">‹ ${esc(b.name)}</button>
          <h1>${esc(t.label)}</h1>
          <p class="sub">${done} of ${b.rows} rows</p>
        </header>
        <div class="wrap">
          ${extra}
          <section class="panel">
            <div style="display:flex;justify-content:space-between;gap:.5rem;align-items:start">
              <p class="muted">Tap a row when that job is done.</p>
              <div class="home-actions">
                <button class="ghost btn" data-act="mark">Mark remaining rows done</button>
                <button class="danger" data-act="clear-rows">Clear completed rows</button>
              </div>
            </div>
            <div class="bar"><span style="width:${b.rows?(done/b.rows)*100:0}%"></span></div>
            <div class="rows">${Array.from({length:b.rows},(_,i)=>`<button class="row-btn ${rowDone(i+1)?"done":""}" data-act="row" data-row="${i+1}">${rowDone(i+1) ? (i+1) + " done" : "Row " + (i+1)}</button>`).join("")}</div>
          </section>
        </div>`;
    }

    function maintHTML() {
      return `<header class="head"><button class="back" data-go="home">‹ Blocks</button><h1>Maintenance</h1></header>
        <div class="wrap">
          <section class="panel"><h2>Equipment</h2>
            <form class="form grid" id="eq-form"><input name="name" placeholder="Name" required /><input name="notes" placeholder="Notes" /><button>Add</button></form>
            <ul class="list">${data.equipment.map((e)=>`<li><div><strong>${esc(e.name)}</strong></div><button class="danger" data-act="del-eq" data-id="${e.id}">Remove</button></li>`).join("")}</ul>
          </section>
          <section class="panel"><h2>Log service</h2>
            <form class="form grid" id="log-form">
              <input name="date" type="date" value="${today()}" />
              <select name="equipmentId" required><option value="">Equipment</option>${data.equipment.map((e)=>`<option value="${e.id}">${esc(e.name)}</option>`).join("")}</select>
              <select name="serviceType">${data.serviceTypes.map((t)=>`<option>${esc(t)}</option>`).join("")}</select>
              <input name="hours" placeholder="Hours / meter" />
              <input name="notes" placeholder="Notes" />
              <button>Log</button>
            </form>
            <form class="form grid" id="type-form"><input name="type" placeholder="New service type" required /><button>Add type</button></form>
            <ul class="list">${data.serviceLogs.map((l)=>`<li><div><strong>${l.date} · ${esc(data.equipment.find(e=>e.id===l.equipmentId)?.name||"")}</strong><p class="meta">${esc(l.serviceType)}</p></div><button class="danger" data-act="del-log" data-id="${l.id}">Remove</button></li>`).join("")}</ul>
          </section>
        </div>`;
    }

    function exportHTML() {
      const pack = reports();
      const cards = [
        ["overview", "Vineyard overview", "Season summary for every block: task progress, watering hours, weed hours, and latest harvest numbers."],
        ["sprays", "Sprays log", "Every foliar and herbicide pass: date, block, chemical, rate, volume, tank, notes, and rows."],
        ["blocks", "Block-by-block", "One section per block: tasks, watering, weeds, foliar, herbicide, and harvest samples."],
      ];
      return `<header class="head"><button class="back" data-go="home">‹ Blocks</button><h1>Export</h1></header>
        <div class="wrap">
          <p class="note">Share a CSV into Files, Mail, or Sheets. Or share / copy the readable overview.</p>
          ${copied ? `<p class="muted">${copied}</p>` : ""}
          ${cards.map(([id, title, blurb]) => {
            const r = pack[id];
            return `<section class="panel export-card">
              <h2>${title}</h2>
              <p class="muted">${blurb}</p>
              <div class="form grid">
                <button class="primary btn" data-act="share-csv" data-id="${id}">Share CSV spreadsheet</button>
                <button class="ghost btn" data-act="share-text" data-id="${id}">Share written report</button>
                <button class="ghost btn" data-act="copy-text" data-id="${id}">Copy report text</button>
              </div>
              <pre class="preview">${esc(r.text)}</pre>
            </section>`;
          }).join("")}
        </div>`;
    }

    function bind() {
      document.querySelectorAll("[data-go]").forEach((el) => el.addEventListener("click", () => {
        screen = el.getAttribute("data-go");
        if (el.dataset.id && screen === "block") { blockId = el.dataset.id; tab = "tasks"; }
        if (el.dataset.id && screen === "task") { taskId = el.dataset.id; sprayId = ""; }
        render();
      }));
      document.querySelectorAll("[data-act]").forEach((el) => el.addEventListener("click", async (e) => {
        e.preventDefault();
        const act = el.getAttribute("data-act");
        const id = el.getAttribute("data-id");
        if (act === "tab") tab = id;
        if (act === "del-block" && confirm("Delete this block?")) {
          data.blocks = data.blocks.filter((b) => b.id !== id);
          if (blockId === id) { screen = "home"; blockId = ""; }
        }
        if (act === "del-water") data.watering = data.watering.filter((w) => w.id !== id);
        if (act === "del-weed") data.weedLogs = data.weedLogs.filter((w) => w.id !== id);
        if (act === "del-spray") { data.sprays = data.sprays.filter((s) => s.id !== id); sprayId = ""; }
        if (act === "del-herb") { data.herbicide = data.herbicide.filter((s) => s.id !== id); herbId = ""; }
        if (act === "sel-spray") sprayId = id;
        if (act === "sel-herb") herbId = id;
        if (act === "del-sample") data.samples = data.samples.filter((s) => s.id !== id);
        if (act === "del-eq") data.equipment = data.equipment.filter((x) => x.id !== id);
        if (act === "del-log") data.serviceLogs = data.serviceLogs.filter((x) => x.id !== id);
        if (act === "row") {
          const r = Number(el.getAttribute("data-row"));
          const b = block();
          if ((tab === "foliar" || tab === "herbicide") && screen === "block") {
            const s = activeSpray(tab); if (!s) return;
            const k = String(r); if (s.rows[k]) delete s.rows[k]; else s.rows[k] = today();
          } else {
            const k = rowKey(data.year, b.id, taskId, r);
            if (data.done[k]) delete data.done[k]; else data.done[k] = today();
          }
        }
        if (act === "clear-rows") {
          const b = block();
          if ((tab === "foliar" || tab === "herbicide") && screen === "block") {
            const s = activeSpray(tab); if (!s) return;
            s.rows = {};
          } else if (b && taskId) {
            const prefix = data.year + ":" + b.id + ":" + taskId + ":";
            Object.keys(data.done).forEach((k) => { if (k.startsWith(prefix)) delete data.done[k]; });
          }
        }
        if (act === "clear-all-rows") {
          if (!confirm("Clear every completed row for all jobs this season? Water, weeds, and spray logs stay.")) return;
          data.done = {};
          data.sprays.forEach((s) => { if (s.year === data.year) s.rows = {}; });
          data.herbicide.forEach((s) => { if (s.year === data.year) s.rows = {}; });
        }
        if (act === "mark") {
          const b = block(); const stamp = today();
          if ((tab === "foliar" || tab === "herbicide") && screen === "block") {
            const s = activeSpray(tab); if (!s) return;
            for (let r = 1; r <= b.rows; r++) if (!s.rows[String(r)]) s.rows[String(r)] = stamp;
          } else {
            for (let r = 1; r <= b.rows; r++) {
              const k = rowKey(data.year, b.id, taskId, r);
              if (!data.done[k]) data.done[k] = stamp;
            }
          }
        }
        if (act === "share-csv" || act === "share-text" || act === "copy-text") {
          const r = reports()[id];
          if (!r) return;
          if (act === "share-csv") await shareCsv(r.name, r.csv);
          else if (act === "share-text") await shareText(r.title, r.text);
          else {
            await navigator.clipboard.writeText(r.text);
            copied = r.title + " copied.";
          }
          render();
          return;
        }
        save(); render();
      }));

      const rename = document.getElementById("rename");
      if (rename) rename.addEventListener("change", () => {
        const b = block(); if (!b) return;
        b.name = rename.value.trim() || b.name;
        save();
      });
      const rowCount = document.getElementById("row-count");
      if (rowCount) rowCount.addEventListener("change", () => {
        const b = block(); if (!b) return;
        b.rows = Math.max(1, Number(rowCount.value) || 40);
        save(); render();
      });

      const addBlock = document.getElementById("add-block");
      if (addBlock) addBlock.addEventListener("submit", (e) => {
        e.preventDefault();
        const f = new FormData(addBlock);
        data.blocks.push({ id: uid(), name: String(f.get("name")).trim(), variety: "", rows: Math.max(1, Number(f.get("rows")) || 40), plants: "" });
        save(); render();
      });

      const addTask = document.getElementById("add-task");
      if (addTask) addTask.addEventListener("submit", (e) => {
        e.preventDefault();
        const label = String(new FormData(addTask).get("label") || "").trim();
        if (!label) return;
        if (data.tasks.some((t) => t.label.toLowerCase() === label.toLowerCase())) return;
        data.tasks.push({ id: uid(), label });
        save(); render();
      });

      const blockMeta = document.getElementById("block-meta");
      if (blockMeta) blockMeta.addEventListener("submit", (e) => {
        e.preventDefault();
        const b = block(); const f = new FormData(blockMeta);
        b.variety = String(f.get("variety") || "").trim();
        b.rows = Math.max(1, Number(f.get("rows")) || 1);
        b.plants = String(f.get("plants") || "").trim();
        save(); render();
      });

      const addWater = document.getElementById("add-water");
      if (addWater) addWater.addEventListener("submit", (e) => {
        e.preventDefault();
        const f = new FormData(addWater);
        data.watering.unshift({ id: uid(), year: data.year, blockId, date: String(f.get("date") || today()), hours: String(f.get("hours") || "").trim(), notes: String(f.get("notes") || "").trim() });
        save(); render();
      });
      const addWeed = document.getElementById("add-weed");
      if (addWeed) addWeed.addEventListener("submit", (e) => {
        e.preventDefault();
        const f = new FormData(addWeed);
        data.weedLogs.unshift({ id: uid(), year: data.year, blockId, date: String(f.get("date") || today()), hours: String(f.get("hours") || "").trim(), notes: String(f.get("notes") || "").trim() });
        save(); render();
      });

      function bindSprayForm(formId, listKey, idKey) {
        const sprayForm = document.getElementById(formId);
        if (!sprayForm) return;
        sprayForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const f = new FormData(sprayForm);
          const chemical = String(f.get("chemical") || "").trim();
          if (!chemical) return;
          const next = { id: uid(), year: data.year, date: String(f.get("date")||today()), blockId, chemical, rate: String(f.get("rate")||"").trim(), volume: String(f.get("volume")||"").trim(), tank: String(f.get("tank")||"").trim(), notes: String(f.get("notes")||"").trim(), rows: {} };
          data[listKey].unshift(next);
          if (idKey === "sprayId") sprayId = next.id; else herbId = next.id;
          save(); render();
        });
      }
      bindSprayForm("spray-form", "sprays", "sprayId");
      bindSprayForm("herb-form", "herbicide", "herbId");

      const sampleForm = document.getElementById("sample-form");
      if (sampleForm) sampleForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const f = new FormData(sampleForm);
        data.samples.unshift({ id: uid(), date: String(f.get("date")||today()), blockId, rows: String(f.get("rows")||"").trim(), brix: String(f.get("brix")||"").trim(), ph: String(f.get("ph")||"").trim(), ta: String(f.get("ta")||"").trim(), notes: String(f.get("notes")||"").trim() });
        save(); render();
      });

      const eqForm = document.getElementById("eq-form");
      if (eqForm) eqForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const f = new FormData(eqForm);
        const name = String(f.get("name")||"").trim();
        if (name) data.equipment.unshift({ id: uid(), name, notes: String(f.get("notes")||"").trim() });
        save(); render();
      });
      const typeForm = document.getElementById("type-form");
      if (typeForm) typeForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const name = String(new FormData(typeForm).get("type")||"").trim();
        if (name && !data.serviceTypes.includes(name)) data.serviceTypes.push(name);
        save(); render();
      });
      const logForm = document.getElementById("log-form");
      if (logForm) logForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const f = new FormData(logForm);
        const equipmentId = String(f.get("equipmentId")||"");
        if (!equipmentId) return;
        data.serviceLogs.unshift({ id: uid(), date: String(f.get("date")||today()), equipmentId, serviceType: String(f.get("serviceType")||""), hours: String(f.get("hours")||"").trim(), notes: String(f.get("notes")||"").trim() });
        save(); render();
      });
    }

    render();
  </script>
</body>
</html>
